[package]
name = "santara-tauri"
version = "0.1.0"
description = "Santara Tauri runtime prototype"
authors = ["Santara contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[features]
default = []
