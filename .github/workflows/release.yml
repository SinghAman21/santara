name: Publish Santra release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (for example 1.2.0)'
        required: true
        type: string
      summary:
        description: 'Short description of what this update includes'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      summary: ${{ steps.release.outputs.summary }}
    steps:
      - id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SUMMARY: ${{ inputs.summary }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'Version must be semantic, such as 1.2.0 or 1.2.0-rc.1.' >&2
            exit 1
          fi
          if [[ -z "${INPUT_SUMMARY//[[:space:]]/}" ]]; then
            echo 'A short release summary is required.' >&2
            exit 1
          fi
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<SANTRA_RELEASE_SUMMARY'
            echo "$INPUT_SUMMARY"
            echo 'SANTRA_RELEASE_SUMMARY'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            package_command: npm run dist:linux
            package_kind: linux
          - os: ubuntu-22.04
            package_command: npm run dist:windows
            package_kind: windows-cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev xvfb xauth ffmpeg poppler-utils qpdf pandoc libimage-exiftool-perl lld llvm nsis clang wine g++-mingw-w64-x86-64
      - run: npm ci
      - name: Install Windows cross-build toolchain
        if: matrix.package_kind == 'windows-cross'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin
      - name: Apply release version to bundle metadata
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node --input-type=module -e "import fs from 'node:fs'; const v=process.env.RELEASE_VERSION; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=v; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n'); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); l.version=v; l.packages[''].version=v; fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\\n'); const t=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); t.version=v; fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(t,null,2)+'\\n');"
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e
      - run: npm run check:release
      - name: Build release packages
        run: ${{ matrix.package_command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Santra-${{ matrix.package_kind }}-v${{ needs.validate.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify tag is unused and create version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; choose a new version." >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Santra $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: Santra-*-v${{ needs.validate.outputs.version }}
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SUMMARY: ${{ needs.validate.outputs.summary }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print | sort)
          if [[ ${#assets[@]} -ne 3 ]]; then
            echo "Expected exactly three installers; found ${#assets[@]}." >&2
            exit 1
          fi
          exe=$(find release-assets -type f -name '*.exe' -print -quit)
          deb=$(find release-assets -type f -name '*.deb' -print -quit)
          appimage=$(find release-assets -type f -name '*.AppImage' -print -quit)
          cp "$exe" release-assets/santra.exe
          cp "$deb" release-assets/santra.deb
          cp "$appimage" release-assets/santra.AppImage
          gh release create "$RELEASE_TAG" \
            release-assets/santra.exe \
            release-assets/santra.deb \
            release-assets/santra.AppImage \
            --title "Santra v$RELEASE_VERSION" \
            --notes "$RELEASE_SUMMARY" \
            --latest
