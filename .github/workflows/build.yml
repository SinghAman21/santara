name: Build Santara Tauri
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev xvfb xauth ffmpeg poppler-utils qpdf pandoc libimage-exiftool-perl
      - name: Set up MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e
      - run: npm run check:release
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Build Windows NSIS package
        if: runner.os == 'Windows'
        run: npm run dist:windows
      - name: Generate dependency inventory and package hashes
        run: npm run release:report
      - uses: actions/upload-artifact@v4
        with:
          name: Santara-Tauri-${{ runner.os }}-x64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            build/release-report.json
            build/dependency-inventory.json
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
