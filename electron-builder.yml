appId: io.santara.app
productName: Santara
asar: true
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extraMetadata:
  main: electron/main.mjs
extraResources:
  - from: build/THIRD_PARTY_LICENSES.txt
    to: licenses/THIRD_PARTY_LICENSES.txt
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
win:
  icon: build/icon.ico
  extraResources:
    - from: native/windows/build/santara-drag-watcher.exe
      to: native/santara-drag-watcher.exe
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
linux:
  executableName: santara
  executableArgs:
    - --ozone-platform=x11
  icon: build/icon.png
  syncDesktopName: true
  category: Utility
  maintainer: Santara contributors
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
